name: Installer Release

on:
  push:
    tags:
      - "installer-v*.*.*"

env:
  GO_VERSION: '1.24.2'

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./installer/go

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux-amd64
            ext: ''
          - goos: linux
            goarch: arm64
            platform: linux-arm64
            ext: ''
          - goos: linux
            goarch: arm
            platform: linux-arm
            ext: ''
          - goos: windows
            goarch: amd64
            platform: windows-amd64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            platform: macos-amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            platform: macos-arm64
            ext: ''

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: "**/go.sum"

    - name: Download dependencies
      run: go mod download

    - name: Build binary for ${{ matrix.platform }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
        TAG_NAME: ${{ github.ref_name }}
      run: |
        VERSION="${TAG_NAME#installer-v}"
        ARTIFACT="flowfuse-device-installer-${VERSION}-${{ matrix.platform }}${{ matrix.ext }}"
        echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
        echo "Building ${ARTIFACT}"

        mkdir -p artifacts
        go build -ldflags "-X main.instVersion=${VERSION} -s -w" \
          -o "artifacts/${ARTIFACT}" main.go

        ls -la "artifacts/${ARTIFACT}"

        # Smoke-test the version output on the native build only
        if [ "${{ matrix.platform }}" = "linux-amd64" ]; then
          "./artifacts/${ARTIFACT}" --version
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARTIFACT }}
        path: artifacts/${{ env.ARTIFACT }}
        retention-days: 1

  publish-artifacts:
    name: Add Binaries to Release
    runs-on: ubuntu-latest
    needs: [build-artifacts]

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: flowfuse-device-installer-*
        merge-multiple: true

    - name: Add artifacts as release assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        ls -la artifacts/
        gh release upload "$TAG_NAME" artifacts/* --clobber \
          --repo "${{ github.repository }}"
